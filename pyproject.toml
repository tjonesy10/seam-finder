[project]
name = "seam-finder"
version = "0.1.0"
description = "Load nflverse players, teams, games, and player week stats into Postgres."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "polars>=1.0",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["loader", "web"]

[tool.setuptools.package-data]
web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "network: downloads live nflverse release files",
]

[tool.ruff]
line-length = 100
target-version = "py312"
