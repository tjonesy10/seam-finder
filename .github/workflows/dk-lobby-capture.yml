name: dk lobby capture

# Approved schedule text. Capture stays off until a later rollout sets the
# repository variable DK_LOBBY_CAPTURE_ENABLED to the exact value true.
# Merging this file does not run a live capture.
#
# Manual dispatch authorization checklist (F014 R8). The historical 403 is a
# non-goal and is not a build blocker:
# - workflow_dispatch stays the manual entry. This file does not call the
#   Actions dispatch API and does not poll another run.
# - The runtime GITHUB_TOKEN stays contents:read. No actions:write is added.
# - An external fine-grained token or GitHub App needs repository access and
#   Actions: write. Classic PAT and OAuth repo-scope requirements, and any
#   repository policy, must be checked separately.
# - A repository-authorized user or browser is the manual fallback only after
#   that authorization. Do not collect credentials or widen grants to diagnose
#   a 403.

on:
  schedule:
    # 10:07 America/New_York. Minute 7 stays off the top of the hour.
    - cron: '7 10 * * 3'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      season:
        description: "REG season year. Required for a manual dispatch."
        required: false
        type: string
        default: ""
      week:
        description: "REG week 1-18. Required for a manual dispatch."
        required: false
        type: string
        default: ""
      draft_group_id:
        description: "Explicit positive draft group id. Not labeled Sunday main."
        required: false
        type: string
        default: ""
      selection:
        description: "sunday-afternoon, or blank when draft_group_id is set."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dk-lobby-capture
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ vars.DK_LOBBY_CAPTURE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Confirm capture gate
        env:
          DK_LOBBY_CAPTURE_ENABLED: ${{ vars.DK_LOBBY_CAPTURE_ENABLED }}
        run: python -c "import os, sys; from loader.dk_lobby import capture_schedule_enabled; sys.exit(0 if capture_schedule_enabled(os.environ.get('DK_LOBBY_CAPTURE_ENABLED')) else 1)"

      - name: Capture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          READONLY_ROLE: ${{ vars.READONLY_ROLE }}
          SALARY_PRIVATE_MIGRATION: ${{ vars.SALARY_PRIVATE_MIGRATION }}
          DK_SCHEDULE_AUTHORITY_SHA256: ${{ vars.DK_SCHEDULE_AUTHORITY_SHA256 }}
          DK_LOBBY_CAPTURE_ENABLED: ${{ vars.DK_LOBBY_CAPTURE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
          WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.week || '' }}
          DRAFT_GROUP_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_group_id || '' }}
          SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.selection || '' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            python -m loader.pipeline \
              --trigger manual \
              --season "${SEASON}" \
              --week "${WEEK}" \
              --draft-group-id "${DRAFT_GROUP_ID}" \
              --selection "${SELECTION}"
          else
            python -m loader.pipeline --trigger schedule --selection sunday-afternoon
          fi
