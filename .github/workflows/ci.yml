name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seam
          POSTGRES_DB: seam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seam -d seam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Test
        env:
          PGUSER: seam
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: seam_test
        run: |
          scheme=postgresql
          export DATABASE_URL="${scheme}://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          ruff check loader web tests migrations
          pytest
