name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seam
          POSTGRES_DB: seam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seam -d seam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test
        env:
          PGUSER: seam
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: seam_test
        run: |
          scheme=postgresql
          export DATABASE_URL="${scheme}://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          ruff check loader web tests migrations
          unset SERVE_SPA
          pytest tests/test_api.py
          SERVE_SPA=true pytest tests/test_api.py
          unset SERVE_SPA
          pytest
          gitleaks detect --source . --redact --no-banner --log-opts=--all

      - name: Frontend end-to-end
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://seam@127.0.0.1:5432/seam_test
        run: npm run e2e

  visual:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seam
          POSTGRES_DB: seam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seam -d seam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Visual and accessibility comparisons
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://seam@127.0.0.1:5432/seam_test
        run: |
          npm run e2e:visual
          npm run e2e:visual

      - name: Upload synthetic visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
